<!-- @dsCard group="Components" viewport="700x360" name="Forms, Tabs & Inputs" subtitle="Input, Checkbox, Switch, Tabs, Card" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; }
  .sec { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 16px; }
  .row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 28px; }
  .col { display: flex; flex-direction: column; gap: 16px; }
</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Input, Checkbox, Switch, Tabs } = window.WalmartDesignSystem_e58acd;
    function Demo() {
      const [tab, setTab] = React.useState('all');
      return (
        <div>
          <Tabs tabs={[{id:'all',label:'All'},{id:'deals',label:'Deals',count:24},{id:'new',label:'New arrivals'}]} value={tab} onChange={setTab} style={{marginBottom:24}} />
          <div className="sec">Inputs</div>
          <div className="row">
            <Input label="Search Walmart" iconLeft="search" placeholder="Try 'paper towels'" containerStyle={{width:280}} />
            <Input label="Email address" iconLeft="mail" type="email" hint="For order updates" containerStyle={{width:240}} />
            <Input label="ZIP code" error="Enter a valid 5-digit ZIP" defaultValue="9" containerStyle={{width:160}} />
          </div>
          <div className="sec">Selection</div>
          <div className="row">
            <div className="col">
              <Checkbox label="Free shipping" defaultChecked />
              <Checkbox label="Pickup today" />
              <Checkbox label="Out of stock" disabled />
            </div>
            <div className="col">
              <Switch label="Walmart+ member price" defaultChecked />
              <Switch label="Show coupons only" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body></html>
