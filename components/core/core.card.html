<!-- @dsCard group="Components" viewport="700x400" name="Buttons & Chips" subtitle="Pill buttons in every variant, plus filter chips" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; }
  .sec { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 28px; }
  .dark { background: var(--wm-bentonville-blue); border-radius: var(--radius-lg); padding: 20px 20px; }
</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, Chip } = window.WalmartDesignSystem_e58acd;
    function Demo() {
      const [sel, setSel] = React.useState('a');
      return (
        <div>
          <div className="sec">Variants</div>
          <div className="row">
            <Button variant="primary" iconLeft="plus">Launch campaign</Button>
            <Button variant="secondary">Save as draft</Button>
            <Button variant="spark">Ask Sparky</Button>
            <Button variant="ghost">Learn more</Button>
          </div>
          <div className="sec">Sizes & states</div>
          <div className="row">
            <Button size="sm">Small</Button>
            <Button size="md">Medium</Button>
            <Button size="lg" iconRight="chat">Large</Button>
            <Button disabled>Disabled</Button>
          </div>
          <div className="sec">On dark</div>
          <div className="row dark">
            <Button variant="ondark" iconLeft="chat">Chat with your rep</Button>
            <Button variant="spark">Explore Ad Center</Button>
          </div>
          <div className="sec">Chips</div>
          <div className="row">
            <Chip selected={sel==='a'} onClick={()=>setSel('a')} icon="filter">Under $500 budget</Chip>
            <Chip selected={sel==='b'} onClick={()=>setSel('b')}>Auto-bidding</Chip>
            <Chip selected={sel==='c'} onClick={()=>setSel('c')}>High performing</Chip>
            <Chip onRemove={()=>{}}>Back to School</Chip>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body></html>
