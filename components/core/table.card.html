<!-- @dsCard group="Components" viewport="700x420" name="Table" subtitle="Campaign list with tabular numeric columns" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; }
</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Table, Badge } = window.WalmartDesignSystem_e58acd;
    function Demo() {
      const columns = [
        { key: 'name', label: 'Campaign' },
        { key: 'status', label: 'Status', render: (row) => <Badge variant={row.variant}>{row.status}</Badge> },
        { key: 'budget', label: 'Daily budget', numeric: true },
        { key: 'impressions', label: 'Impressions', numeric: true },
        { key: 'clicks', label: 'Clicks', numeric: true },
        { key: 'ctr', label: 'CTR', numeric: true },
      ];
      const rows = [
        { name: 'Back to School', status: 'Active', variant: 'success', budget: '$450', impressions: '128,400', clicks: '3,216', ctr: '2.5%' },
        { name: 'Home Refresh', status: 'Under review', variant: 'info', budget: '$200', impressions: '54,110', clicks: '974', ctr: '1.8%' },
        { name: 'Holiday Toys', status: 'Draft', variant: 'neutral', budget: '$600', impressions: '—', clicks: '—', ctr: '—' },
        { name: 'Summer Grilling', status: 'Ended', variant: 'outline', budget: '$300', impressions: '212,908', clicks: '5,540', ctr: '2.6%' },
      ];
      return <Table columns={columns} rows={rows} getRowKey={(row) => row.name} />;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body></html>
