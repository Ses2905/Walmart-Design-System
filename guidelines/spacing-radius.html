<!-- @dsCard group="Spacing" viewport="700x180" name="Corner Radius" subtitle="From subtle 8px cards to the fully-pill button" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 84px; height: 64px; background: var(--wm-sky-50); border: 1.5px solid var(--wm-true-blue); }
  .pill { width: 84px; height: 44px; background: var(--wm-true-blue); border-radius: var(--radius-pill); }
  .lbl { font-size: 11px; color: var(--text-secondary); margin-top: 12px; }
  .lbl b { color: var(--text-primary); display: block; font-weight: var(--fw-bold); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl"><b>sm</b>8px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl"><b>md</b>12px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl"><b>lg</b>16px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl"><b>xl</b>24px</div></div>
    <div class="item"><div class="pill"></div><div class="lbl"><b>pill</b>999px</div></div>
  </div>
</body></html>
