<!-- @dsCard group="Type" viewport="760x300" name="Eyebrow" subtitle="UI Medium · 8px · uppercase · 2.5 expanded · True Blue" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface);padding: 24px;display:flex;flex-direction:column;gap:32px}
.ex{display:flex;flex-direction:column;gap:12px}
.ex h2{font-size:34px;font-weight:var(--fw-light);max-width:22ch}
.ex p{font-size:15px;color:var(--text-secondary);max-width:60ch}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--border-subtle)}
.specs div{padding:12px 16px 0 0;font-size:12px;color:var(--text-tertiary)}
.specs b{display:block;color:var(--text-primary);font-size:13px;font-weight:500}</style></head>
<body>
  <div class="ex">
    <span class="wm-eyebrow">Section eyebrow</span>
    <h2>The eyebrow sits above the headline, never below it.</h2>
    <p>One line, sentence-case content set in caps, no terminal punctuation. Use it to label the section, not to summarise it.</p>
  </div>
  <div class="specs">
    <div><b>Everyday Sans UI</b>family</div>
    <div><b>Medium / 500</b>weight</div>
    <div><b>8px · 0.25em</b>size &amp; tracking</div>
    <div><b>True Blue #0053E2</b>colour</div>
  </div>
</body></html>
