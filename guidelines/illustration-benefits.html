<!-- @dsCard group="Illustration" viewport="820x300" name="Walmart+ Benefit Spots" subtitle="Isometric spot illustrations for membership benefits & services" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-surface);padding: 24px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:8px}
  .art{width:100%;aspect-ratio:1/1;border-radius:var(--radius-md);background:var(--wm-sky-50);display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
  .art img{max-width:100%;max-height:100%;object-fit:contain}
  .cap{font-size:11px;color:var(--text-secondary);text-align:center}
  .note{margin-top:16px;font-size:11px;color:var(--text-tertiary);max-width:660px;line-height:1.5}
</style></head>
<body>
  <div class="grid">
    <div class="tile"><div class="art"><img src="../assets/illustrations/benefits/free-shipping.png"></div><span class="cap">Free Shipping</span></div>
    <div class="tile"><div class="art"><img src="../assets/illustrations/benefits/gas-savings.png"></div><span class="cap">Gas Savings</span></div>
    <div class="tile"><div class="art"><img src="../assets/illustrations/benefits/free-pharmacy-delivery.png"></div><span class="cap">Rx Delivery</span></div>
    <div class="tile"><div class="art"><img src="../assets/illustrations/benefits/auto-care-savings.png"></div><span class="cap">Auto Care</span></div>
    <div class="tile"><div class="art"><img src="../assets/illustrations/benefits/onepay.png"></div><span class="cap">OnePay</span></div>
  </div>
  <p class="note">Isometric, blue-family spot illustrations for Walmart+ and services. Consistent lighting and a shared 3-quarter angle. Full set in <b>assets/illustrations/benefits/</b>.</p>
</body></html>
