<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-surface);padding: 24px}
  .stack{display:flex;flex-direction:column;gap:20px}
  .row{display:grid;grid-template-columns:132px 1fr;align-items:baseline;gap:20px}
  .meta{font-size:12px;color:var(--text-tertiary);line-height:1.4}
  .meta b{display:block;color:var(--text-secondary);font-weight:700;font-size:13px}
  .spec{color:var(--text-primary)}
  .divider{height:1px;background:var(--border-subtle)}
</style></head>
<body>
  <div class="stack">
    <div class="row"><span class="meta"><b>Headings</b>Headline Light</span><span class="spec" style="font-family:var(--font-heading);font-weight:300;font-size:40px;letter-spacing:-.02em;line-height:1">Save money. Live better.</span></div>
    <div class="divider"></div>
    <div class="row"><span class="meta"><b>Body</b>UI Regular</span><span class="spec" style="font-family:var(--font-body);font-weight:400;font-size:20px;line-height:1.35">Everyday low prices on the things families need most.</span></div>
    <div class="divider"></div>
    <div class="row"><span class="meta"><b>Eyebrow</b>UI Medium · 2.5 expanded</span><span class="spec wm-eyebrow">Everyday low prices</span></div>
    <div class="divider"></div>
    <div class="row"><span class="meta"><b>Numbers</b>Mono, tabular</span><span class="spec" style="font-family:var(--font-numeric);font-weight:400;font-size:16px">SKU 573920118 &nbsp; QTY 04 &nbsp; $  9.44</span></div>
  </div>
</body></html>
