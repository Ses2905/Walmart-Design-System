<!-- @dsCard group="Colors" viewport="700x180" name="Semantic & Tints" subtitle="Status colors plus blue/sky surface washes" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .cell { border-radius: var(--radius-md); padding: 12px 16px; min-height: 58px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .t { font-size: 13px; font-weight: var(--fw-bold); }
  .h { font-size: 11px; opacity: .8; text-transform: uppercase; }
</style></head>
<body>
  <div class="grid">
    <div class="cell" style="background:var(--wm-success-bg);color:var(--wm-success)"><span class="t">Success</span><span class="h">#128A08</span></div>
    <div class="cell" style="background:var(--wm-error-bg);color:var(--wm-error)"><span class="t">Error / Rejected</span><span class="h">#DE1C24</span></div>
    <div class="cell" style="background:var(--wm-true-blue);color:#fff"><span class="t">Info / Link</span><span class="h">#0053E2</span></div>
    <div class="cell" style="background:var(--wm-blue-50);color:var(--wm-bentonville-blue)"><span class="t">Blue 50 wash</span><span class="h">#E8F0FF</span></div>
    <div class="cell" style="background:var(--wm-sky-50);color:var(--wm-bentonville-blue)"><span class="t">Sky 50 wash</span><span class="h">#EAF6FD</span></div>
    <div class="cell" style="background:var(--wm-gray-100);color:var(--wm-gray-700)"><span class="t">Surface sunken</span><span class="h">#EEF0F3</span></div>
  </div>
</body></html>
