<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { border-radius: var(--radius-lg); padding: 28px; display: flex; align-items: center; justify-content: center; gap: 20px; min-height: 92px; }
  .light { background: var(--wm-gray-50); border: 1px solid var(--border-subtle); }
  .dark { background: var(--wm-bentonville-blue); }
  .lockup { display: flex; align-items: center; gap: 16px; }
  .cap { grid-column: 1 / -1; font-size: 11px; color: var(--text-tertiary); margin-top: -4px; }
</style></head>
<body>
  <div class="grid">
    <div class="panel light"><img src="../assets/logos/spark-everyday-blue.svg" style="height:52px"><img src="../assets/logos/wordmark-trueblue.svg" style="height:26px"></div>
    <div class="panel dark"><img src="../assets/logos/spark-everyday-blue.svg" style="height:52px"><img src="../assets/logos/wordmark-white.svg" style="height:26px"></div>
    <div class="panel light"><img src="../assets/logos/spark-everyday-blue.svg" style="height:64px"></div>
    <div class="panel dark"><img src="../assets/logos/wordmark-white.svg" style="height:30px"></div>
    <div class="cap">The Spark appears in Everyday Blue. The wordmark is True Blue on light, White on dark. Maintain clear space equal to the height of one Spark petal.</div>
  </div>
</body></html>
