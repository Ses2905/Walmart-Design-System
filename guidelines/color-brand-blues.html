<!-- @dsCard group="Colors" viewport="700x190" name="Brand Blues" subtitle="The four-blue core: True, Bentonville, Everyday, Sky" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; }
  .row { display: flex; gap: 16px; }
  .sw { flex: 1; }
  .chip { height: 88px; border-radius: var(--radius-md); border: 1px solid rgba(0,30,96,.08); }
  .name { font-size: 13px; font-weight: var(--fw-bold); color: var(--text-primary); margin-top: 12px; }
  .hex { font-size: 12px; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--wm-true-blue)"></div><div class="name">True Blue</div><div class="hex">#0053E2</div></div>
    <div class="sw"><div class="chip" style="background:var(--wm-bentonville-blue)"></div><div class="name">Bentonville Blue</div><div class="hex">#001E60</div></div>
    <div class="sw"><div class="chip" style="background:var(--wm-everyday-blue)"></div><div class="name">Everyday Blue</div><div class="hex">#4DBDF5</div></div>
    <div class="sw"><div class="chip" style="background:var(--wm-sky-blue)"></div><div class="name">Sky Blue</div><div class="hex">#A9DDF7</div></div>
  </div>
</body></html>
