<!-- @dsCard group="Brand" viewport="900x620" name="Outline Icons" subtitle="Line-style icon set (Icon variant=&quot;outline&quot;) — tint via currentColor (CSS mask)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; }
  .note { font-size: 12px; color: var(--text-tertiary); margin: 0 0 16px; max-width: 640px; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 20px 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ic { width: 24px; height: 24px; background: var(--wm-bentonville-blue);
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
    -webkit-mask-size: contain; mask-size: contain; }
  .lbl { font-size: 9px; color: var(--text-tertiary); text-align: center; }
</style></head>
<body>
  <p class="note">Line-style companion to the 40 solid Functional Icons — a separate name space on the same <code>Icon</code> component (<code>&lt;Icon name="cart-outline" variant="outline" /&gt;</code>). Names are best-effort visual labels assigned during asset extraction; no names were embedded in the original source file.</p>
  <div class="grid" id="g"></div>
  <script>
    const icons = ['accessibility','account','adjust','apparel-outline','arrow-left','arrow-right','audio','bag-outline','bike','cafe','calendar','camera-outline','cart-outline','categories','chat-outline','checklist','clock-outline','credit-card-outline','current-location','customer-service','delivery','document','dollar','download-outline','ev-charging','exit','family','favorite-outline','featured','fire-safety','gift-outline','grid-outline','home-outline','home-security','id-badge','info','lock-outline','log-out','map','member','mobile','no-parking','no-pets','no-smoking','notification-outline','package','parking','phone','protection-plan','qr-code','receipt-outline','refresh','restroom','restroom-men','restroom-women','return-outline','savings','search-outline','security-camera','storefront','thumbs-down','thumbs-up','to-go','tracking','truck','upload-outline','verified','wallet'];
    document.getElementById('g').innerHTML = icons.map(n =>
      `<div class="item"><span class="ic" style="-webkit-mask-image:url(../assets/icons/outline/${n}.svg);mask-image:url(../assets/icons/outline/${n}.svg)"></span><span class="lbl">${n}</span></div>`
    ).join('');
  </script>
</body></html>
