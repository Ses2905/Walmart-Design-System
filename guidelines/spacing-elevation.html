<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Soft, navy-tinted shadows — xs to lg, plus card" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; }
  .row { display: flex; gap: 24px; }
  .item { text-align: center; flex: 1; }
  .box { height: 70px; background: #fff; border-radius: var(--radius-lg); }
  .lbl { font-size: 12px; color: var(--text-secondary); margin-top: 16px; font-weight: var(--fw-medium); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lbl">xs</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lbl">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-card)"></div><div class="lbl">card</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lbl">md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lbl">lg</div></div>
  </div>
</body></html>
