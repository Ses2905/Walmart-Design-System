<!-- @dsCard group="Spacing" viewport="700x190" name="Spacing Scale" subtitle="4px base unit — space-1 through space-16" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .meta { width: 132px; flex: none; font-size: 12px; color: var(--text-secondary); }
  .meta b { color: var(--text-primary); font-weight: var(--fw-bold); }
  .bar { height: 14px; background: var(--wm-true-blue); border-radius: 3px; }
</style></head>
<body>
  <div class="stack">
    <div class="row"><span class="meta"><b>space-1</b> · 4px</span><span class="bar" style="width:4px"></span></div>
    <div class="row"><span class="meta"><b>space-2</b> · 8px</span><span class="bar" style="width:8px"></span></div>
    <div class="row"><span class="meta"><b>space-3</b> · 12px</span><span class="bar" style="width:12px"></span></div>
    <div class="row"><span class="meta"><b>space-4</b> · 16px</span><span class="bar" style="width:16px"></span></div>
    <div class="row"><span class="meta"><b>space-6</b> · 24px</span><span class="bar" style="width:24px"></span></div>
    <div class="row"><span class="meta"><b>space-8</b> · 32px</span><span class="bar" style="width:32px"></span></div>
    <div class="row"><span class="meta"><b>space-12</b> · 48px</span><span class="bar" style="width:48px"></span></div>
    <div class="row"><span class="meta"><b>space-16</b> · 64px</span><span class="bar" style="width:64px"></span></div>
  </div>
</body></html>
