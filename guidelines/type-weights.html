<!-- @dsCard group="Type" viewport="700x210" name="Everyday Sans — Weights" subtitle="Light 300 · Regular 400 · Medium 500 · Bold 700 · Black 900" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .line { display: flex; align-items: baseline; gap: 20px; }
  .meta { width: 120px; flex: none; font-size: 12px; color: var(--text-tertiary); }
  .word { font-size: 34px; color: var(--text-primary); letter-spacing: -.01em; line-height: 1.25; }
</style></head>
<body>
  <div class="stack">
    <div class="line"><span class="meta">Light · 300</span><span class="word" style="font-weight:300">Walmart</span></div>
    <div class="line"><span class="meta">Regular · 400</span><span class="word" style="font-weight:400">Walmart</span></div>
    <div class="line"><span class="meta">Medium · 500</span><span class="word" style="font-weight:500">Walmart</span></div>
    <div class="line"><span class="meta">Bold · 700</span><span class="word" style="font-weight:700">Walmart</span></div>
    <div class="line"><span class="meta">Black · 900</span><span class="word" style="font-weight:900">Walmart</span></div>
  </div>
</body></html>
