<!-- @dsCard group="Type" viewport="700x300" name="Everyday Sans — Scale" subtitle="Display to caption, the full type ramp" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .line { display: flex; align-items: baseline; gap: 16px; }
  .meta { width: 92px; flex: none; font-size: 11px; color: var(--text-tertiary); font-weight: var(--fw-medium); }
  .spec { color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style></head>
<body>
  <div class="stack">
    <div class="line"><span class="meta">Display · 64</span><span class="spec" style="font-size: 36px; font-weight: 900; letter-spacing: -.02em; line-height: 1">Save Money. Live Better.</span></div>
    <div class="line"><span class="meta">H1 · 44 · Bold</span><span class="spec" style="font-size: 24px; font-weight: 700; letter-spacing: -.02em">Everyday low prices</span></div>
    <div class="line"><span class="meta">H3 · 26 · Bold</span><span class="spec" style="font-size: 18px; font-weight: 700; letter-spacing: -.01em">Shop by department</span></div>
    <div class="line"><span class="meta">Body · 16 · Reg</span><span class="spec" style="font-size: 12px; font-weight: 400">Pickup and delivery, all in one place.</span></div>
    <div class="line"><span class="meta">Small · 14 · Med</span><span class="spec" style="font-size: 11px; font-weight: 500; color: var(--text-secondary)">Free shipping, arrives in 2 days</span></div>
    <div class="line"><span class="meta">Eyebrow · 12</span><span class="spec" style="font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary)">Rollback</span></div>
  </div>
</body></html>
