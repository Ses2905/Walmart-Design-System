<!-- @dsCard group="Colors" viewport="700x170" name="Neutral Ramp" subtitle="Cool, navy-tinted greys for text, borders, surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-surface); padding: 24px; }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; text-align: center; }
  .chip { height: 64px; border-radius: var(--radius-sm); border: 1px solid rgba(0,30,96,.08); }
  .name { font-size: 11px; font-weight: var(--fw-medium); color: var(--text-secondary); margin-top: 8px; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--wm-gray-50)"></div><div class="name">50</div></div>
    <div class="sw"><div class="chip" style="background:var(--wm-gray-100)"></div><div class="name">100</div></div>
    <div class="sw"><div class="chip" style="background:var(--wm-gray-200)"></div><div class="name">200</div></div>
    <div class="sw"><div class="chip" style="background:var(--wm-gray-300)"></div><div class="name">300</div></div>
    <div class="sw"><div class="chip" style="background:var(--wm-gray-400)"></div><div class="name">400</div></div>
    <div class="sw"><div class="chip" style="background:var(--wm-gray-500)"></div><div class="name">500</div></div>
    <div class="sw"><div class="chip" style="background:var(--wm-gray-600)"></div><div class="name">600</div></div>
    <div class="sw"><div class="chip" style="background:var(--wm-gray-700)"></div><div class="name">700</div></div>
    <div class="sw"><div class="chip" style="background:var(--wm-gray-800)"></div><div class="name">800</div></div>
    <div class="sw"><div class="chip" style="background:var(--wm-gray-900)"></div><div class="name">900</div></div>
  </div>
</body></html>
